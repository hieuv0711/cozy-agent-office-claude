name: CI

# Every pull request, and master after a merge: the same checks a release runs before it publishes.
# The end-to-end tests need a GPU to draw the scene, so they run on a Mac (CONTRIBUTING.md, "Tests").
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Token and cost checks
        run: npm run selftest
      - run: npm run build
      - name: Package the extension
        run: npm run build:vscode
      - name: What the npm package would contain
        run: npm pack --dry-run
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 14
